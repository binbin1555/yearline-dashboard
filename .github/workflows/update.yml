name: 每日更新

# 由 cron-job.org 通过 repository_dispatch 触发（交易日 21:00 北京时间）。
# 不使用 GitHub 自带的 schedule —— 它在高峰期会延迟甚至丢失触发。
on:
  repository_dispatch:
    types: [daily-update]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 脚本只用标准库，无需 pip install —— 少一个故障点
      - name: 抓取数据并计算信号
        id: strategy
        continue-on-error: true
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 仅自建 Bark 服务器时需要；未设置则用官方 api.day.app
          BARK_HOST: ${{ secrets.BARK_HOST }}
        run: python scripts/run.py

      # 无论成功与否都提交：status.json 里记录了失败原因，页面要能显示
      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 标记运行失败
        if: steps.strategy.outcome == 'failure'
        run: |
          echo "::error::策略脚本返回非零退出码，已发送 Bark 告警"
          exit 1
